version: "3.9"
services:
  backend:
    build: ./backend
    container_name: recipe-backend
    env_file: ./backend/.env
    environment:
      # Override DB path to volume-mounted directory
      - DATABASE_URL=sqlite+aiosqlite:///./data/recipes.db
    volumes:
      - sqlite_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: recipe-frontend
    environment:
      - PUBLIC_API_URL=/api
    ports:
      - "8080:80"   # Public entry point
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
