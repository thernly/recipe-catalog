[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "authlib>=1.9.5",
    "bleach>=6.4.0",
    "email-validator==2.4.0",
    "fastapi[standard]==0.165.0",
    "fpdf2>=2.9.0",
    "greenlet>=3.5.6",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "python-dotenv==1.2.4",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart==0.0.34",
    "slowapi>=0.1.10",
    "sqlalchemy==2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]==0.54.0",
    "wonderwords==3.0.1",
    "httpx2>=2.16.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "B008",    # FastAPI Depends pattern
    "B904",    # Exception chaining (raise from)
    "N818",    # Exception naming convention
    "N806",    # Variable naming in tests
    "B017",    # Blind exception assertions in tests
    "SIM108",  # Ternary operator preference
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["N999"]  # Ignore naming conventions in migrations

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = false  # Will enable gradually
no_implicit_optional = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "fpdf.*",
    "bleach.*",
    "authlib.*",
    "wonderwords.*",
]
ignore_missing_imports = true

# Legacy-ORM relaxation. The SQLAlchemy mypy plugin was removed in 2.1, and the
# models still declare attributes as `x = Column(...)` rather than
# `x: Mapped[T] = mapped_column(...)`. Without the plugin mypy sees every model
# attribute as `Column[T]`, so reading one into an `int`/`str` parameter is
# [arg-type], writing one is [assignment], and returning a comparison on one
# from a `-> bool` method is [return-value]. Those three codes are disabled
# only in the modules below, which touch model attributes directly; every other
# check still applies to them, and every other module is checked in full.
# To retire an entry: migrate the models it uses to Mapped[...] and delete it.
[[tool.mypy.overrides]]
module = [
    "app.api.auth",
    "app.api.collections",
    "app.api.households",
    "app.api.import_recipes",
    "app.api.intake",
    "app.api.meal_plans",
    "app.api.oauth",
    "app.api.recipes.crud",
    "app.api.shopping_lists",
    "app.api.users",
    "app.models.oauth_state",
    "app.models.token",
    "app.models.user",
    "app.services.household",
    "app.utils.pdf_export",
]
disable_error_code = ["arg-type", "assignment", "return-value"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
filterwarnings = [
    "ignore::DeprecationWarning:slowapi",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
