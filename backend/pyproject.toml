[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=3.0.0",
    "aiosqlite==0.21.0",
    "alembic==1.17.2",
    "argon2-cffi==25.1.0",
    "authlib>=1.3.0",
    "bleach>=6.0.0",
    "email-validator==2.3.0",
    "fastapi[standard]==0.121.2",
    "fpdf2>=2.7.0",
    "httpx==0.28.1",
    "pydantic==2.12.4",
    "pydantic-settings==2.12.0",
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "python-dotenv==1.2.1",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart==0.0.20",
    "slowapi>=0.1.9",
    "sqlalchemy==2.0.44",
    "uvicorn[standard]==0.38.0",
    "wonderwords==3.0.1",
]

[dependency-groups]
dev = [
    "mypy>=1.7.1",
    "ruff>=0.14.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "B008",    # FastAPI Depends pattern
    "B904",    # Exception chaining (raise from)
    "N818",    # Exception naming convention
    "N806",    # Variable naming in tests
    "B017",    # Blind exception assertions in tests
    "SIM108",  # Ternary operator preference
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["N999"]  # Ignore naming conventions in migrations

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = false  # Will enable gradually
no_implicit_optional = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "fpdf.*",
    "bleach.*",
    "authlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
