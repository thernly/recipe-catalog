  # Dependabot: eslint's @eslint/config-array still asks for minimatch ^10
  minimatch@<11.0.1: "^11.0.1"
  # Dependabot: @tailwindcss/typography pins 6.0.10
  postcss-selector-parser@<6.1.5: "^6.1.5"
  undici: "^7.25.0"
  ws: ">=8.20.1"

peerDependencyRules:
  allowedVersions:
    "@tailwindcss/typography>tailwindcss": "3"
